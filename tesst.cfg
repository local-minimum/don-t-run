[RECEPTION]
type="node"
text=["blablabal"]

[RECEPTION: COUNTER]
commands=[["LOOK", "COUNTER"], ["GO", "COUNTER"]]
effect="add_location(VISITED-COUNTER)"
text=["blablabal"]

[RECEPTION: COMPUTER]
commands=[["LOOK", "COMPUTER"], ["USE", "COMPUTER"]]
hidden="location(!VISITED-COUNTER)"
effect="add_location(EXPECTED)"
text=["blablabal"]

[RECEPTION: BADGE]
commands=[["LOOK", "BADGE"]]
hidden="location(!VISITED-COUNTER)"
text=["blablabal"]

[RECEPTION: BADGE-PICKUP]
commands=[["TAKE", "BADGE"]]
hidden="location(!VISITED-COUNTER) && location(!RECEPTION: BADGE)"
effect="add_inventory(RECEPTION: BADGE)"
text=["blablabal"]

[RECEPTION: DOOR 1]
hidden="inventory(!BADGE) || inventory(!EXPECTED)"
text=["blablabal"]
target="move(conference room)"
