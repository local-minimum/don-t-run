[RECEPTION]
type="node"
text=["blablabal"]

[RECEPTION: COUNTER]
commands=[["LOOK", "COUNTER"], ["GO", "COUNTER"]]
effect="add_location(VISITED-COUNTER)"
text=["blablabal"]

[RECEPTION: COMPUTER]
commands=[["LOOK", "COMPUTER"], ["USE", "COMPUTER"]]
hidden="location(!VISITED-COUNTER)"
effect="add_location(EXPECTED)"
text=["blablabal"]

[RECEPTION: BADGE]
id="badge"
commands=[["LOOK", "BADGE"]]
hidden="location(!VISITED-COUNTER)"
text=["blablabal"]

[RECEPTION: BADGE-PICKUP]
commands=[["TAKE", "BADGE"]]
hidden="location(!VISITED-COUNTER) && location(!RECEPTION: BADGE)"
effect="add_global(_INVENTORY, RECEPTION: BADGE)"
text=["blablabal"]

[RECEPTION: DOOR 1]
hidden="global(_INVENTORY, !BADGE) || location(!EXPECTED)"
text=["blablabal"]
target="move(CONFERENCE ROOM)"
