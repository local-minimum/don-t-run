[RECEPTION]
type="node"
text=["blablabal"]

[RECEPTION: COUNTER]
commands=[["LOOK", "COUNTER"], ["GO", "COUNTER"]]
effect="ADD_LOCATION(VISITED-COUNTER)"
text=["blablabal"]

[RECEPTION: COMPUTER]
commands=[["LOOK", "COMPUTER"], ["USE", "COMPUTER"]]
hidden="LOCATION(!VISITED-COUNTER)"
effect="ADD_LOCATION(EXPECTED)"
text=["blablabal"]

[RECEPTION: BADGE]
commands=[["LOOK", "BADGE"]]
hidden="LOCATION(!VISITED-COUNTER)"
text=["blablabal"]

[RECEPTION: BADGE-PICKUP]
commands=[["TAKE", "BADGE"]]
hidden="LOCATION(!VISITED-COUNTER) && INVENTORY(!RECEPTION: BADGE)"
effect="ADD_INVENTORY(RECEPTION: BADGE)"
text=["blablabal"]

[RECEPTION: DOOR 1]
hidden="INVENTORY(!BADGE) || LOCATION(!EXPECTED)"
text=["blablabal"]
