[INVENTORY]
global=true

[INVENTORY: BACK]
commands=[["GO", "BACK"]]
target="move_back()"

[_: LOOK]
global=true
commands=[["LOOK", "*"]]
text=["You see nothing particular."]

[_: FALLBACK]
global=true
commands=[["*", "*"]]
text=["You cannot do that."]

[CAR]
text=[
"Fortunately, you found a parking place right outside the address that the rather stern letter had directed you to.

It is a nondescript six stories tall brick building in the middle of a block. The street is busy.",
"You are sitting in your car outside the building indicated in the letter you received in the mail two days ago."
]

[CAR: AROUND]
commands=[["LOOK", "AROUND"]]
effect="add_location(looked)"
text=["The car is turned off, there's a letter laying on the passenger seat and outside you see the brick building with the entrance marked 60."]

[CAR: LETTER]
id="LETTER"
commands=[["LOOK", "LETTER"], ["USE", "LETTER"]]
hidden="location(!looked)"
text=["Dear Sir or Madam

It has come to our attention that you failed to attend the scheduled meeting on the 24th of October, 2026.

You have seven days to present yourself at the our offices or your case will be handed over to the authorities.

Best Regards,
Dir. S Man
THE Method Emporium
South Utopia Corner Key Street 60 {CURSOR 2}{MORE}{CURSOR 0}{CLEAR} You had never heard of the company, any meeting or in fact the street before you you got this letter."]

[CAR: PICKUP LETTER]
commands=[["TAKE", "LETTER"]]
hidden="global(INVENTORY, LETTER) || location(!looked)"
effect="add_global(INVENTORY, LETTER)"
text=["You pick up the letter from the passenger seat and cram it into your back pocket."]

[CAR: DOOR]
commands=[["GO", "DOOR"], ["USE", "DOOR"]]
text=["Opening the door, you step out of the car onto the sidewalk."]
target="move(OUTSIDE)"

[CAR: CAR]
commands=[["USE", "CAR"]]
text=[
"You spent all day yesterday thinking about the letter. Procrastinating. But you are here now and there is no way you are going to leave before this thing, whatever it is, has been sorted out.",
"No, there's no going back home. Not until this has been dealt with."
]

[OUTSIDE]
name="SIDEWALK"
text=["For such a busy street, with cars flying by in both directions, the sidewalk is surprisingly deserted.

Your car is parked right in front of the entrance - two big sliding, tinted doors. There are no markings, logos or other such clutter to be seen. Except for an oversized, yet quite discrete, \"60\" above the door."]

[OUTSIDE: AROUND]
commands=[["LOOK", "AROUND"]]
text=["There's not much to see. The glass doors are too opaque to spot what is waiting inside. Your car is in need of a wash, but it has seen worse days."]

[OUTSIDE: CAR]
commands=[["GO", "CAR"], ["USE", "CAR"]]
text=["You decide that you need a moment to collect yourself inside your car."]
target="move(CAR)"

[OUTSIDE: LOBBY]
hidden="global(INVENTORY, LETTER)"
commands=[["GO", "LOBBY"]]
text=["As you approach the large glass doors, they silently slide apart."]

[OUTSIDE: LOBBY NO LETTER]
hidden="global(INVENTORY, !LETTER)"
commands=[["GO", "LOBBY"]]
text=["You look at the glass doors. About to go in, you realize you don't have your letter with you. Probably best bring it. Just in case."]

[LOBBY]
text=["The lobby is deserted. At first glance you notice a flat-screen monitor on one wall is showing the building information, an elevator is located in the back, and a set of doors  seems to lead to a pair of toilets."]

[LOBBY: AROUND]
commands=[["LOOK", "AROUND"]]
text=["In one corner you see a stand with what looks like brochures. On the wall opposite the toilets, there are several posters."]
effect="add_location(looked)"

[LOBBY: OUTSIDE]
commands=[["GO", "OUTSIDE"]]
text=["For a moment, you feel like the doors will refuse to let you out, but then, when you are almost about to walk right into them, they slide apart."]
target="move(OUTSIDE)"

[LOBBY: TOILET]
commands=[["GO", "TOILET"], ["USE", "TOILET"]]
text=["The toilet doors are both unlocked, you pick the left one. \"At random,\" you think to yourself."]
target="move(TOILET)"

[LOBBY: ELEVATOR]
commands=[["GO", "ELEVATOR"]]
text=["You cross to the far side of the rather spacious and desolate lobby where the elevator is located."]
target="move(ELEVATOR)"

[LOBBY: POSTERS]
commands=[["LOOK", "POSTERS"]]
hidden="location(!looked)"
text=["There are three posters.

The first one depicts a desk with a red typewriter. There’s no text or message on it.

The second one depicts what looks like a worker's lounge with a coffee machine to one corner and the text: \"DRINK FIRST.\"

The last poster has the word \"TOGETHER\" repeated over and over in different colors. It looks quite different from the other two. "]

[LOBBY: TAKE POSTERS]
commands=[["TAKE", "POSTERS"]]
hidden="location(!looked)"
text=[
"The do look kinda sick, in an ironic way. Looking around, you see no obvious surveillance equipment.{WAIT 1}

However, it'd be way too awkward to waltz into this meeting with their own posters as loot under one arm. Maybe on the way out though, if things go south.",
"Nope, at least not yet."
]

[LOBBY: STAND]
commands=[["LOOK", "STAND"]]
hidden="location(!looked)"
effect="add_location(letter)"
text=["The brochures seems to be a mix of advertisements about renting office space in the building, info about fire escape routes, and other material that doesn't seem to apply to you.

However, as you browse through the brochures on the stand you notice that someone has shoved a letter, just like yours, behind the fire escape plans."]

[LOBBY: HIDDEN LETTER]
commands=[["USE", "LETTER"], ["LOOK", "LETTER"]]
hidden="location(!letter)"
text=["Dear Sir or Madam

It has come to our attention that you failed to attend the scheduled meeting on the 24th of October, 2026.

You have seven days to present yourself at the our offices or your case will be handed over to the authorities.

Best Regards,
Dir. S Man
THE Method Emporium
South Utopia Corner Key Street 60 {CURSOR 2}{MORE}{CURSOR 0}{CLEAR}
Exactly like your letter. What can this mean?"]

[LOBBY: PICKUP HIDDEN LETTER]
commands=[["TAKE", "LETTER"]]
hidden="location(!letter)"
text=["You consider it for a moment. Then decide that it's best to leave this letter here and bring your own, even though they seem identical. You never know."]

[LOBBY: TV]
commands=[["LOOK", "TV"], ["USE", "TV"]]
effect="add_global(INVENTORY, knows floor)"
text=["The television shows who is renting on what floor. You easily find that the people you are here for are all the way up on the 6th floor."]

[TOILET]
text=[
"Even though the lobby looked spotless and you've yet to see another human being, the toilet looks heavily used. There are several stains in the bowl and the water isn't clear.{SIGNAL disgusting} Further, there isn't any paper.

There’s a sink and a mirror on the left wall and someone has scribbled a poem on the right."
]

[TOILET: AROUND]
command=["LOOK", "AROUND"]
text=["Not doing that, no. Too disgusting here."]

[TOILET: TOILET]
command=["USE", "TOILET"]
text=["You aren't that desperate. Yet."]

[TOILET: TAKE TOILET]
command=[["TAKE", "TOILET"]]
text=["It is stuck to the floor. Fortunately."]

[TOILET: MIRROR]
command=[["USE", "MIRROR"], ["LOOK", "MIRROR"]]
text=["Your reflection looks nervous. You really don't want to be here."]

[TOILET: DOOR]
command=[["GO", "DOOR"], ["USE", "DOOR"]]
text=["You leave the filthy toilet behind, regretting that you went in there."]
target="move(LOBBY)"

[TOILET: POEM]
command=[["LOOK", "POEM"]]
text=["This winter's been quite absurd.
You'd better believe my word:
I came in for a dump,
but from my rump
came a solid icicle-turd.!"]

[ELEVATOR]
text_rule="pick_index(true, location(!here), location(here))"
text=[
"The elevator door is made out of partially reflective metal. There's a button to call the elevator, it seems to be on the third floor.",
"A well lit, empty elevator is waiting for you to step in."]

[ELEVATOR: LOBBY]
command=[["GO", "LOBBY"]]
effect="REMOVE_LOCATION(here)"
text=["You leave the elevator area."]
target="move(LOBBY)"

[ELEVATOR: BUTTON]
command=[["USE", "BUTTON"]]
effect="add_location(here)"
text_rule="pick_index(true, location(!here), location(here))"
text=[
"Pressing the button, everything remains silent for a moment. Then a faint hissing sound announces that the elevator approaches and moments later it opens its doors.",
"The elevator is already here, but you press the button again. Because it feels good.",
]

[ELEVATOR: ELEVATOR]
command=[["GO", "ELEVATOR"], ["USE", "ELEVATOR"]]
text=["As you step inside, you notice that the air is slightly cooler."]
target="move(ELEVATOR INTERNAL)"

[ELEVATOR INTERNAL]
name="INSIDE ELEVATOR"
text_rule="pick_index(true, global(INVENTORY, LETTER), global(INVENTORY, !LETTER))"
text=[
"The elevator seems to beckon you to press the button labeled \"6.\"",
"The elevator waits for you to indicate what floor you want to go to, but you don't have a clue which. And you are not going to be a bad citizen and press all buttons at once.",
]

[ELEVATOR INTERNAL: 6-BUTTON]
command=[["GO", "6-BUTTON"], ["USE", "6-BUTTON"]]
hidden="global(INVENTORY, knows floor)"
text=["You take a deep breath{SIGNAL breath} - whatever this is, it cannot be that bad - and press the 6.
{CURSOR 2}{WAIT 2}{CURSOR 0}{SIGNAL going-up}
The door closes - almost soundlessly.  And the elevator speeds upwards much too fast for just a six stories.
{CURSOR 2}{MORE}{CURSOR 0}{CLEAR}"]
target="move(UPPER RECEPTION)"

[ELEVATOR INTERNAL: LOBBY]
command=[["GO", "LOBBY"]]
text=["You sense that you are not yet ready."]
target="move(LOBBY)"

[UPPER RECEPTION]
name="RECEPTION"
effect="add_global(INVENTORY, freezing)"
text=[
"The elevator spills you out into another soulless, and abandoned room.

There's a counter. It very much feels like someone should be sitting there.

Behind the counter on the wall, is what must be the company logo. There are a couple small but of sturdy looking firs in various planters and good thing they aren't any exotic flowers as whomever runs this place has turned the AC way, way down.

You are freezing.

You notice several doors leading further into the office and behind you the elevator door closes.",
"The reception is decorated with several plants. There's a counter and a logo on the wall behind it. Several doors lead further into the office and there's also the elevator, but you are not going to leave before you are done."
]

[UPPER RECEPTION: AROUND]
command=["LOOK", "AROUND"]
text=["The logo behind the counter looks like an eight if the two circles had melted together in the middle. The lower circle is larger than the upper one.

The doors don't look like a visitor ought to wander through alone, but there also is absolutely no one around. The only life is a slight humming sound from the computer behind the reception counter. The receptionist should be back any moment, or so you think."]

[UPPER RECEPTION: ELEVATOR]
command=[["GO", "ELEVATRO"], ["USE", "ELEVATOR"]]
text=["You are not done yet. And you are not going to waste another day worrying about this, so you are not leaving."]

[UPPER RECEPTION: COUNTER]
command=[["LOOK", "COUNTER"], ["GO", "COUNTER"]]
effect="add_location(counter)"
text=[
"Even though it feels [b\]wrong[/b\], you walk around the reception counter. You rest your hand against the back of the office chair and you can still feel the lingering warmth of someone having been sitting here just recently.

The computer shows a screen saver. There's also a visitors badge laying next to it."
]

[UPPER RECEPTION: COMPUTER]
command=[["LOOK", "COMPUTER"], ["USE", "COMPUTER"]]
hidden="location(!counter)"
effect="add_location(expected)"
text=[
"As you move the mouse, the screen saver instantly flickers off and you are surprised to discover that the computer was left unlocked.

By the looks of it, a scheduling app is running. The current time marker shows a large block with a single name on it.{WAIT 1} [b\]Yours.[/b\]{WAIT 1}

You never told them you were coming. How can they know you would be here now?",
"You check the computer again. Yes it's your name there. You are [b\]expected[/b\]. Right now."
]

[UPPER RECEPTION: TAKE COMPUTER]
command=["TAKE", "COMPUTER"]
hidden="location(!counter)"
text=["You are no thief{WAIT 0.4} and besides it looks heavy."]

[UPPER RECEPTION: BADGE]
id="BADGE"
hidden="location(!counter) && global(INVENTORY, BADGE)"
command=["LOOK", "BADGE"]
text=["It is a plastic badge on a lanyard. It says VISITOR with large letters and there's a faint arctic blue eight-looking symbol in the background."]

[UPPER RECEPTION: TAKE BADGE]
command=["TAKE", "BADGE"]
hidden="location(!counter) || global(INVENTORY, BADGE)"
effect="add_global(INVENTORY, BADGE)"
text=["There doesn't seem to be [b\]anyone[/b\] around. And if you were to wander past the doors, you'd would feel much better having a proper badge."]

[UPPER RECEPTION: PLANTERS]
command=["LOOK", "PLANTERS"]
text=["The [b\]firs[/b\] look well kept, green, and no needles are scattered on the floor around them. The soil is moist and the fragrance from the tree, though subtle, brings back a vivid feeling winter holidays. With that comes a strong urge for a big cup of [b\]hot[/b\] chocolate, or maybe coffee."]

[UPPER RECEPTION: DOOR CONFERENCE]
command=[["GO", "DOOR 1"], ["USE", "DOOR 1"]]
hidden="location(!expected) || global(INVENTORY, BADGE)"
effect="rewrite_location_referants(DOOR 1, CONFERENCE ROOM DOOR) && add_location(visited conference)"
text=[
"The door on the left wall looks just like the other two doors. Leaning in to listen to it, you cannot make out any sound from the other side.{WAIT 1}

Carefully you reach out to the handle, and open the door up - pretending that you have a right to go wherever you want.",
"You go back to conference room."
]
target="move(CONFERENCE ROOM)"

[UPPER RECEPTION: LOOK DOOR CONFERENCE]
command=["LOOK", "DOOR 1"]
hidden="location(!expected) || global(INVENTORY, BADGE)"
text_rule="pick_index(true, location(!visited conference), location(visited conference))"
text=[
"In your mind, counting left to right you called this one door 1. Maybe that's a good place as any to start? It looks just like the other two doors, but it is the only door not in the far side wall.

Leaning in to listen to it, you cannot make out any sound from the other side.",
"The door to the conference room looks just like the other doors."
]

[UPPER RECEPTION: DOOR LOUNGE]
command=[["GO", "DOOR 2"], ["USE", "DOOR 2"]]
hidden="location(!expected) || global(INVENTORY, BADGE)"
effect="rewrite_location_referants(DOOR 2, LOUNGE DOOR)"
text_rule="pick_index(true, global(INVENTORY, !reception-lounge), global(INVENTORY, reception-lounge))"
text=[
"",
"You go back to worker's lounge room."
]
target="move(CONFERENCE ROOM) && add_global(INVENTORY, reception-lounge)"

[UPPER RECEPTION: LOOK DOOR LOUNGE]
command=["LOOK", "DOOR 1"]
hidden="location(!expected) || global(INVENTORY, BADGE)"
text_rule="pick_index(true, global(INVENTORY, !reception-lounge), global(INVENTORY, reception-lounge))"
text=[
"There's no obvious indication that this door has been used more or less than any of the other two doors.",
"The door to the worker's lounge is on the left side of the counter."
]

[UPPER RECEPTION: DOOR HALL]
command=[["GO", "DOOR 3"], ["USE", "DOOR 3"]]
hidden="location(!expected) || global(INVENTORY, BADGE)"
effect="rewrite_location_referants(DOOR 3, HALL DOOR)"
text_rule="pick_index(true, location(!reception-hall), global(INVENTORY, reception-hall))"
text=[
"The third door - on the right side of the reception counter looks like the other two.

If you have the badge and you are expected, then why does this feel so wrong?

The door opens up into a hall and in the distance, it bends to the left.

Walking over there, the hall barren: no posters, a plain concrete floor,  white and grey colors on all sides, no doors except a single one where the hall bends.{CURSOR 2}{MORE}{CURSOR 0}{CLEAR}",
"You go back to the cold hall."
]
target="move(HALL) && add_global(INVENTORY, reception-hall)"

[UPPER RECEPTION: LOOK DOOR HALL]
command=["LOOK", "DOOR 3"]
hidden="location(!expected) || global(INVENTORY, BADGE)"
text_rule="pick_index(true, location(!reception-hall), global(INVENTORY, reception-hall))"
text=[
"It’s on the RIGHT side of the counter and it is the third door according to your logic, so maybe that is the correct way forward? ",
"The door to the hall is on the right side of the counter."
]

[UPPER RECEPTION: DOORS]
command=[["LOOK", "DOORS"], ["USE", "DOORS"], ["GO", "DOORS"]]
hidden="location(expected) && global(INVENTORY, BADGE)"
text=[
"There are [b\]three[/b\] doors. They look quite similar, if not near identical and non of them give you a hint where you should continue. If you should. There's no discernible noise coming from any of them."
]
