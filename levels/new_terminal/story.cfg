[INVENTORY]
global=true

[INVENTORY: BACK]
commands=[["GO", "BACK"]]
target="move_back()"

[_: LOOK]
global=true
commands=[["LOOK", "*"]]
text=["You see nothing particular."]

[_: FALLBACK]
global=true
commands=[["*", "*"]]
text=["You cannot do that."]

[CAR]
text=[
"Fortunately, you found a parking place right outside the address that the rather stern letter had directed you to.

It is a nondescript six stories tall brick building in the middle of a block. The street is busy.",
"You are sitting in your car outside the building indicated in the letter you received in the mail two days ago."
]

[CAR: AROUND]
commands=[["LOOK", "AROUND"]]
effect="add_location(looked)"
text=["The car is turned off, there's a letter laying on the passenger seat and outside you see the brick building with the entrance marked 60."]

[CAR: LETTER]
id="LETTER"
commands=[["LOOK", "LETTER"], ["USE", "LETTER"]]
hidden="location(!looked)"
text=["Dear Sir or Madam

It has come to our attention that you failed to attend the scheduled meeting on the 24th of October, 2026.

You have seven days to present yourself at the our offices or your case will be handed over to the authorities.

Best Regards,
Dir. S Man
THE Method Emporium
South Utopia Corner Key Street 60 {CURSOR 2}{MORE}{CURSOR 0}{CLEAR} You had never heard of the company, any meeting or in fact the street before you you got this letter."]

[CAR: PICKUP LETTER]
commands=[["TAKE", "LETTER"]]
hidden="global(INVENTORY, LETTER) || location(!looked)"
effect="add_global(INVENTORY, LETTER)"
text=["You pick up the letter from the passenger seat and cram it into your back pocket."]

[CAR: DOOR]
commands=[["GO", "DOOR"], ["USE", "DOOR"]]
text=["Opening the door, you step out of the car onto the sidewalk."]
target="move(OUTSIDE)"

[CAR: CAR]
commands=[["USE", "CAR"]]
text=[
"You spent all day yesterday thinking about the letter. Procrastinating. But you are here now and there is no way you are going to leave before this thing, whatever it is, has been sorted out.",
"No, there's no going back home. Not until this has been dealt with."
]

[OUTSIDE]
text=["For such a busy street, with cars flying by in both directions, the sidewalk is surprisingly deserted.

Your car is parked right in front of the entrance - two big sliding, tinted doors. There are no markings, logos or other such clutter to be seen. Except for an oversized, yet quite discrete, \"60\" above the door."]

[OUTSIDE: AROUND]
commands=[["LOOK", "AROUND"]]
text=["There's not much to see. The glass doors are too opaque to spot what is waiting inside. Your car is in need of a wash, but it has seen worse days."]

[OUTSIDE: CAR]
commands=[["GO", "CAR"], ["USE", "CAR"]]
text=["You decide that you need a moment to collect yourself inside your car."]
target="move(CAR)"

[OUTSIDE: LOBBY]
commands=[["GO", "LOBBY"]]
text=["As you approach the large glass doors, they silently slide apart."]

[LOBBY]
text=["The lobby is deserted. At first glance you notice a flat-screen monitor on one wall is showing the building information, an elevator is located in the back, and a set of doors  seems to lead to a pair of toilets."]

[LOBBY: AROUND]
commands=[["LOOK", "AROUND"]]
text=["In one corner you see a stand with what looks like brochures. On the wall opposite the toilets, there are several posters."]
effect="add_location(looked)"

[LOBBY: TOILET]
commands=[["GO", "TOILET"], ["USE", "TOILET"]]
text=["The toilet doors are both unlocked, you pick the left one. \"At random,\" you think to yourself."]
target="move(TOILET)"

[LOBBY: ELEVATOR]
commands=[["GO", "ELEVATOR"]]
text=["You cross to the far side of the rather spacious and desolate lobby where the elevator is located."]
target="move(ELEVATOR)"

[LOBBY: POSTERS]
commands=[["LOOK", "POSTERS"]]
hidden="location(!looked)"
text=["There are three posters.

The first one depicts a desk with a red typewriter. There’s no text or message on it.

The second one depicts what looks like a worker's lounge with a coffee machine to one corner and the text: \"DRINK FIRST.\"

The last poster has the word \"TOGETHER\" repeated over and over in different colors. It looks quite different from the other two. "]

[LOBBY: TAKE POSTERS]
commands=[["TAKE", "POSTERS"]]
hidden="location(!looked)"
text=[
"The do look kinda sick, in an ironic way. Looking around, you see no obvious surveillance equipment.{WAIT 1}

However, it'd be way too awkward to waltz into this meeting with their own posters as loot under one arm. Maybe on the way out though, if things go south.",
"Nope, at least not yet."
]

[LOBBY: STAND]
commands=[["LOOK", "STAND"]]
hidden="location(!looked)"
effect="add_location(letter)"
text=["The brochures seems to be a mix of advertisements about renting office space in the building, info about fire escape routes, and other material that doesn't seem to apply to you.

However, as you browse through the brochures on the stand you notice that someone has shoved a letter, just like yours, behind the fire escape plans."]

[LOBBY: HIDDEN LETTER]
commands=[["USE", "LETTER"], ["LOOK", "LETTER"]]
hidden="location(!letter)"
text=["Dear Sir or Madam

It has come to our attention that you failed to attend the scheduled meeting on the 24th of October, 2026.

You have seven days to present yourself at the our offices or your case will be handed over to the authorities.

Best Regards,
Dir. S Man
THE Method Emporium
South Utopia Corner Key Street 60 {CURSOR 2}{MORE}{CURSOR 0}{CLEAR}
Exactly like your letter. What can this mean?"]

[LOBBY: PICKUP HIDDEN LETTER]
commands=[["TAKE", "LETTER"]]
hidden="location(!letter)"
text=["You consider it for a moment. Then decide that it's best to leave this letter here and bring your own, even though they seem identical. You never know."]

[LOBBY: TV]
commands=[["LOOK", "TV"], ["USE", "TV"]]
effect="add_global(INVENTORY, knows floor)"
text=["The television shows who is renting on what floor. You easily find that the people you are here for are all the way up on the 6th floor."]
